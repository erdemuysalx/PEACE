[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "peace"
version = "0.2.0"
description = "PEACE: A Planner-Executor Agent with Constraint Enforcement"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["LLM", "VLM", "agentic", "Ollama", "ROS2"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "ollama>=0.6.0",
    "pillow>=10.0.0",
    "numpy>=1.24.0,<2",
    "requests>=2.28.0",
    "opencv-python>=4.8.0",
    "ultralytics>=8.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
eval = [
    "datasets>=2.0.0",
]

[project.scripts]
peace-planner-executor = "peace.nodes.planner_executor:main"
peace-vision = "peace.nodes.vision:main"
peace-cli = "peace.nodes.cli:main"
peace-teleop = "peace.nodes.teleop:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["peace*"]

[tool.setuptools.package-data]
peace = ["*.yaml", "*.yml", "system_prompts/*.txt"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
